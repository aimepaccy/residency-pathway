<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Residency Pathway</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Residency Pathway</h1>
    <form id="pathway-form">
        <div class="step">
            <label for="university">Your university</label>
            <input type="text" id="university" name="university">
        </div>


        <div class="step">
            <label for="specialty">Specialty</label>
            <select id="specialty" name="specialty">
                <option value="">choose a specialty</option>
                <option value="internal-medicine">Internal Medicine</option>
                <option value="surgery">Surgery</option>
            </select>
        </div>


        <div class="step">
            <fieldset>

                <legend>Preferred region</legend>
                <label><input type="radio" name="region" value="africa"> Africa</label>
                <label><input type="radio" name="region" value="asia"> Asia</label>
                <label><input type="radio" name="region" value="europe"> Europe</label>
                <label><input type="radio" name="region" value="us"> US</label>
                <label><input type="radio" name="region" value="other"> Other</label>
            </fieldset>
        </div>

        <button type="button" id="back-btn">Back</button>
        <button type="button" id="next-btn">Next</button>

        <button type="submit" id="submit-btn">Show my pathway</button>

    </form>
    <div id="results"></div>
    <footer>
        <form id="feedback-form">
            <label for="feedback">What is your feedback?</label>
            <textarea id="feedback" name="feedback" rows="4" maxlength="1000"></textarea>
            <button type="submit">Send feedback</button>
        </form>
        <p id="feedback-status"></p>
    </footer>
    <script src="app.js"></script>
</body>

</html>
